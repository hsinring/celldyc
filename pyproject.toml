[build-system]
requires =["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["celldyc*"]
exclude = ["data*", "reproducibility*"]

[project]
name = "celldyc"
version = "0.0.8"
description = ""
requires-python = ">= 3.9"
classifiers =[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload"
]
dependencies =[
  "adjusttext ~= 1.3.0",
  "ipykernel ~= 7.1.0",
  "ipywidgets ~= 8.1.8",
  "ott-jax == 0.5.1",
  "scvelo == 0.3.3",
  "torch ~= 2.8.0",
  "torchvision ~= 0.23.0",
  "requests"
]

[project.optional-dependencies]
docs =[
  "sphinx == 7.3.7",
  "myst_nb == 1.3.0",
  "sphinx_rtd_theme == 3.0.2",
  "sphinx-design>=0.6.0"
]
