[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["celldyc*"]

[project]
name = "celldyc"
version = "0.0.8"
description = ""
requires-python = ">= 3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload"
]
dependencies = [
  "adjusttext ~= 1.3.0",
  "ipykernel ~= 7.1.0",
  "ipywidgets ~= 8.1.8",
  "ott-jax == 0.5.1",
  "scvelo == 0.3.3",
  "moscot == 0.4.3",
  "torch ~= 2.8.0",
  "torchvision ~= 0.23.0",
  "requests"，
  "uvloop; sys_platform != 'win32'"
]

